# https://render.com/docs/blueprint-spec
# New → Blueprint → connect repo; Render reads this file from the repository root.
databases:
  - name: gizego-db
    databaseName: gizego
    user: gizego
    plan: free

services:
  - type: web
    name: gizego-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: gizego-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PUBLIC_BASE_URL
        sync: false
